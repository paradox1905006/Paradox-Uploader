[versions]
agp = "8.9.1"
kotlin = "2.1.20"
ksp = "2.1.20-2.0.1"
hilt = "2.56"
androidxHilt = "1.2.0"
composeBom = "2025.04.01"
coreKtx = "1.15.0"
activityCompose = "1.10.1"
fragment = "1.8.5"
lifecycle = "2.8.7"
navigation = "2.8.9"
room = "2.7.1"
work = "2.10.1"
datastore = "1.1.1"
